{% extends "base.html" %}
{% block title %}{{ code }} — NoteMaster{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-page__code">{{ code }}</div>
    <h2>{{ title }}</h2>
    {% if detail %}
    <p class="error-page__detail">{{ detail }}</p>
    {% else %}
    <p class="error-page__detail">Запрошенная страница недоступна.</p>
    {% endif %}
    <a href="{{ url_for('index') }}" class="btn btn--primary">На главную</a>
</div>
{% endblock %}
